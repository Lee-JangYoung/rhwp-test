  '@biomejs/biome': 2.5.15
  '@playwright/test': 1.64.1
  '@types/node': 24.19.2
  tsx: 4.23.15
  typescript: 7.0.2
  vitest: 5.0.4
  # 코어·CLI
  '@mermaid-js/mermaid-cli': 12.0.0
  '@rhwp/core': 0.8.7
  '@types/mdast': 4.0.4
  ajv: 8.20.0
  remark-frontmatter: 5.0.0
  remark-gfm: 4.0.1
  remark-parse: 11.0.0
  unified: 11.0.5
  yaml: 2.9.1
  # 등록 단계 LLM (packages/author). 제공자 패키지는 사용자가 필요한 것만 설치한다
  '@langchain/core': 1.2.17
  # MCP 서버 (packages/mcp)
  '@modelcontextprotocol/sdk': 1.32.1
