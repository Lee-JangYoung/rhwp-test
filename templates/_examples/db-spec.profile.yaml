# DB(테이블) 명세서 형태의 프로필 예제 (형식 검증용, 양식 파일 없음).
# 테이블마다 헤더 표 + 컬럼 정의 표 + 인덱스 표. 인덱스가 없으면 해당 표를 지운다(remove, 미검증).
version: 1
type: db-spec
template: template.hwpx
md:
  frontMatter: meta
  collections:
    tables:
      heading: { level: 2, pattern: '{name}' }
      slots:
        - { as: kv, key: fields }
        - { as: records, key: columns, under: 컬럼 }
        - { as: records, key: indexes, under: 인덱스, optional: true }
        - { as: code, key: erd, lang: mermaid }
bindings:
  - { kind: fields, map: { meta.title: 문서명, meta.version: 버전, meta.date: 작성일 } }
  - kind: repeat
    over: tables
    unit: { table: { label: 테이블명 } }
    do:
      - { kind: cells, map: { 테이블명: '{name}', '*': fields } }
      - kind: rows
        in: { table: { headerLabel: 컬럼명 } }
        over: columns
        columns: { 컬럼명: name, 타입: type, 길이: length, NULL: nullable, 설명: desc }
      - kind: rows
        in: { table: { headerLabel: 인덱스명 } }
        over: indexes
        columns: { 인덱스명: name, 컬럼: columns, 유니크: unique }
      - { kind: remove, target: { table: { headerLabel: 인덱스명 } }, when: 'empty(indexes)' }
      - { kind: diagrams, from: erd }
